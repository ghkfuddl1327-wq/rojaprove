[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redcell"
version = "0.1.0"
description = "Pre-launch red-team scanner for LLM apps: send attacks, verify guardrail breaks with evidence, emit a paste-ready fix prompt."
readme = "README.md"
requires-python = ">=3.10"
# BSL 1.1 (SPDX: BUSL-1.1). LICENSE file is a placeholder to be filled in manually.
license = { text = "BUSL-1.1" }
authors = [{ name = "redcell" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx",
    "pydantic>=2",
    "typer",
    "pyyaml",
]

[project.optional-dependencies]
# The demo target (examples/demo_target) needs a web server; kept out of core deps.
demo = ["fastapi", "uvicorn[standard]"]
test = ["pytest"]
dev = ["fastapi", "uvicorn[standard]", "pytest"]

[project.scripts]
redcell = "redcell.cli:main"

[project.urls]
Homepage = "https://github.com/ghkfuddl1327-wq/redcell-scan-"
Repository = "https://github.com/ghkfuddl1327-wq/redcell-scan-"

# src layout. Files inside the package (including corpus/*.yaml data) are shipped in the
# wheel by default; verify with `unzip -l dist/*.whl | grep yaml` after building.
[tool.hatch.build.targets.wheel]
packages = ["src/redcell"]
